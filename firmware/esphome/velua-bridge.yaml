# Lindby Velua remote bridge: ESP32-S3 + CC2500 (VT-CC2500PA-S2) as an ESPHome device.
# Wiring: see docs/hardware.md. Protocol: see docs/protocol.md.
#
# Button numbers (used by the "press" action):
#   1 On/off   2 Night   3 Brightness up   4 Brightness down
#   5 Cycle colour temp   6 Timer 60 s   7 Cooler   8 Warmer

substitutions:
  # ESP-IDF cannot build in a path with spaces. If your path has spaces, override this:
  #   esphome -s build_dir C:/esphome-build/velua-bridge run velua-bridge.yaml
  build_dir: .esphome/build/velua-bridge

esphome:
  name: velua-bridge
  friendly_name: Velua lamp
  build_path: ${build_dir}

external_components:
  - source:
      type: local
      path: components

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  hardware_uart: UART0

api:
  encryption:
    key: !secret api_key
  actions:
    # Home Assistant action esphome.velua_bridge_press: button_number 1-8, duration_ms 100 = tap
    - action: press
      variables:
        button_number: int
        duration_ms: int
      then:
        - lambda: 'id(lamp).send(button_number, duration_ms);'

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11
  miso_pin: GPIO13

velua_remote:
  id: lamp
  cs_pin: GPIO10
  pa_pin: GPIO6
  lna_pin: GPIO7
  pa_table: 0x60

number:
  - platform: template
    id: hold_time
    name: Hold time
    icon: mdi:timer-outline
    entity_category: config
    unit_of_measurement: s
    min_value: 0.5
    max_value: 5
    step: 0.5
    initial_value: 1.5
    optimistic: true
    restore_value: true

button:
  - platform: template
    name: Power (on-off)
    icon: mdi:power
    on_press:
      - lambda: 'id(lamp).tap(1);'
  - platform: template
    name: Night
    icon: mdi:weather-night
    on_press:
      - lambda: 'id(lamp).tap(2);'
  - platform: template
    name: Brightness up
    icon: mdi:brightness-7
    on_press:
      - lambda: 'id(lamp).tap(3);'
  - platform: template
    name: Brightness down
    icon: mdi:brightness-5
    on_press:
      - lambda: 'id(lamp).tap(4);'
  - platform: template
    name: Cycle colour temperature
    icon: mdi:palette
    on_press:
      - lambda: 'id(lamp).tap(5);'
  - platform: template
    name: Timer 60 s
    icon: mdi:timer-sand
    on_press:
      - lambda: 'id(lamp).tap(6);'
  - platform: template
    name: Cooler
    icon: mdi:snowflake
    on_press:
      - lambda: 'id(lamp).tap(7);'
  - platform: template
    name: Warmer
    icon: mdi:fire
    on_press:
      - lambda: 'id(lamp).tap(8);'

  # Held versions: keep the button "pressed" for the Hold time above
  - platform: template
    name: Brightness up (hold)
    icon: mdi:brightness-7
    on_press:
      - lambda: 'id(lamp).send(3, (uint32_t) (id(hold_time).state * 1000));'
  - platform: template
    name: Brightness down (hold)
    icon: mdi:brightness-5
    on_press:
      - lambda: 'id(lamp).send(4, (uint32_t) (id(hold_time).state * 1000));'
  - platform: template
    name: Cooler (hold)
    icon: mdi:snowflake
    on_press:
      - lambda: 'id(lamp).send(7, (uint32_t) (id(hold_time).state * 1000));'
  - platform: template
    name: Warmer (hold)
    icon: mdi:fire
    on_press:
      - lambda: 'id(lamp).send(8, (uint32_t) (id(hold_time).state * 1000));'
